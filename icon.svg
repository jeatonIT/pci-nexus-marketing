<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FD9"/>
      <stop offset="100%" stop-color="#0B4EA6"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4444"/>
      <stop offset="60%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Navy background -->
  <rect width="32" height="32" rx="6" fill="#0F1B3D"/>
  <!-- Shield body -->
  <path d="M16 3 L27 7.5 L27 16 C27 22 22 27 16 29 C10 27 5 22 5 16 L5 7.5 Z"
        fill="url(#shield)" opacity="0.95"/>
  <!-- Shield inner highlight -->
  <path d="M16 5.5 L25 9.5 L25 16 C25 21 21 25.2 16 27 C11 25.2 7 21 7 16 L7 9.5 Z"
        fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  <!-- Spark / burst center -->
  <circle cx="16" cy="16" r="4.5" fill="url(#spark)"/>
  <!-- Spark rays -->
  <line x1="16" y1="9" x2="16" y2="12" stroke="#FF5533" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="16" y1="20" x2="16" y2="23" stroke="#FF5533" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="9" y1="16" x2="12" y2="16" stroke="#FF5533" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="20" y1="16" x2="23" y2="16" stroke="#FF5533" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="11.5" y1="11.5" x2="13.5" y2="13.5" stroke="#FF5533" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="18.5" y1="18.5" x2="20.5" y2="20.5" stroke="#FF5533" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="20.5" y1="11.5" x2="18.5" y2="13.5" stroke="#FF5533" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="11.5" y1="20.5" x2="13.5" y2="18.5" stroke="#FF5533" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <!-- Spark center bright core -->
  <circle cx="16" cy="16" r="2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="16" cy="16" r="1" fill="#FFEEEE"/>
</svg>
