<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7FE8"/>
      <stop offset="50%" stop-color="#1A5EC4"/>
      <stop offset="100%" stop-color="#0D3A8A"/>
    </linearGradient>
    <radialGradient id="sparkCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#FFE8A0"/>
      <stop offset="35%" stop-color="#FF8800"/>
      <stop offset="60%" stop-color="#DD2222" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#AA0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FF6600" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#CC1111" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#880000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF4400" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#FF6600" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#FFCC44" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#FF6600" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF4400" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FF4400" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#FF6600" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#FFCC44" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#FF6600" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF4400" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M80 12 L140 32 L140 82 C140 118 112 140 80 152 C48 140 20 118 20 82 L20 32 Z"
        fill="url(#shieldGrad)" opacity="0.95"/>
  <!-- Shield outline -->
  <path d="M80 12 L140 32 L140 82 C140 118 112 140 80 152 C48 140 20 118 20 82 L20 32 Z"
        fill="none" stroke="#5BB3FF" stroke-width="2.5" opacity="0.9"/>

  <!-- Outer glow -->
  <ellipse cx="80" cy="82" rx="32" ry="32" fill="url(#sparkGlow)" filter="url(#glow)"/>

  <!-- Horizontal beam -->
  <rect x="18" y="77" width="124" height="10" rx="5" fill="url(#beamH)" filter="url(#glow)"/>
  <!-- Vertical beam -->
  <rect x="75" y="42" width="10" height="80" rx="5" fill="url(#beamV)" filter="url(#glow)"/>

  <!-- Diagonal beams -->
  <line x1="48" y1="54" x2="112" y2="110" stroke="#FF6600" stroke-width="4" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>
  <line x1="112" y1="54" x2="48" y2="110" stroke="#FF6600" stroke-width="4" stroke-linecap="round" opacity="0.5" filter="url(#glow)"/>

  <!-- Core spark -->
  <circle cx="80" cy="82" r="18" fill="url(#sparkCore)" filter="url(#glow)"/>
  <!-- Bright center -->
  <circle cx="80" cy="82" r="5" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="80" cy="82" r="2.5" fill="#FFFBE0"/>
</svg>